[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consent-lottery"
version = "0.1.0"
description = "Exact privacy frontiers for feasible agent contract selection"
requires-python = ">=3.9"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2"]

[project.optional-dependencies]
research = ["matplotlib>=3.8,<4", "pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
